<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의 대시보드</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- 1열 1행: 아날로그 시계 -->
        <div class="panel panel-clock">
            <h2 class="panel-title-text">현재 시각</h2>
            <div class="analog-clock">
                <div class="hand hour-hand" id="hour-hand"></div>
                <div class="hand min-hand" id="min-hand"></div>
                <div class="hand sec-hand" id="sec-hand"></div>
                <div class="center-dot"></div>
            </div>
        </div>

        <!-- 2열 1행: 강좌명 -->
        <div class="panel panel-title">
            <h1 id="course-title">강좌명을 입력해 주십시오</h1>
        </div>

        <!-- 3열 1행: 출석 QR -->
        <div class="panel panel-qr">
            <h2 class="panel-title-text">출석 확인</h2>
            <img id="qr-image" src="https://via.placeholder.com/200?text=QR+Code" alt="출석 QR 코드">
        </div>

        <!-- 1열 2행: 설정 버튼 -->
        <div class="panel panel-settings">
            <button id="settings-btn" class="icon-btn">
                <span class="btn-icon">⚙️</span>
            </button>
        </div>

        <!-- 2열 2행: 강의 순서 -->
        <div class="panel panel-sequence">
            <h2 class="panel-title-text">강의 순서</h2>
            <ul id="lecture-sequence">
                <li>1. 등록 및 오리엔테이션</li>
                <li>2. 본 강의 진행</li>
                <li>3. 질의응답 및 마무리</li>
            </ul>
        </div>

        <!-- 3열 2행: 음악 재생 버튼 -->
        <div class="panel panel-music">
            <button id="music-toggle-btn" class="icon-btn play-btn"></button>
            <div id="yt-container" style="display: none;"></div>
        </div>
    </div>

    <!-- 설정 모달창 -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h3>대시보드 정보 설정</h3>
            
            <label>글자 크기 조절:</label>
            <input type="range" id="input-fontsize" min="12" max="28" value="16">

            <label>강좌명 기입:</label>
            <input type="text" id="input-title" placeholder="변경하실 강좌명을 입력하십시오.">

            <label>출석 QR 이미지 직접 업로드:</label>
            <input type="file" id="input-qr-file" accept="image/*" class="file-input">

            <label>유튜브 영상 주소(URL):</label>
            <input type="text" id="input-youtube" placeholder="재생할 유튜브 링크를 입력하십시오.">

            <label>강의 순서 (줄바꿈으로 구분하여 입력하십시오):</label>
            <textarea id="input-sequence" rows="4"></textarea>

            <div class="btn-group">
                <button id="save-settings-btn" class="simple-btn save-btn">적용하기</button>
                <button id="close-settings-btn" class="simple-btn cancel-btn">닫기</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
