<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의 대시보드</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- 좌측 상단: 실시간 시간 -->
        <div class="panel top-left pastel-blue">
            <h2>현재 시각</h2>
            <div id="clock">00:00:00</div>
        </div>

        <!-- 가운데 상단: 강좌명 -->
        <div class="panel top-center pastel-yellow">
            <h1 id="course-title">강좌명을 입력해 주십시오</h1>
        </div>

        <!-- 우측 상단: 출석 QR -->
        <div class="panel top-right pastel-green">
            <h2>출석 확인</h2>
            <img id="qr-image" src="https://via.placeholder.com/150?text=QR+Code" alt="출석 QR 코드">
        </div>

        <!-- 좌측 하단: 설정 -->
        <div class="panel bottom-left pastel-purple">
            <h2>대시보드 설정</h2>
            <button id="settings-btn" class="simple-btn">설정 열기</button>
        </div>

        <!-- 가운데 하단: 강의 순서 -->
        <div class="panel bottom-center pastel-pink">
            <h2>강의 순서</h2>
            <ul id="lecture-sequence">
                <li>1. 등록 및 오리엔테이션</li>
                <li>2. 본 강의 진행</li>
                <li>3. 질의응답 및 마무리</li>
            </ul>
        </div>

        <!-- 우측 하단: 유튜브 연동 (음악 재생) -->
        <div class="panel bottom-right pastel-peach">
            <h2>배경 음악 재생</h2>
            <iframe id="youtube-player" width="100%" height="180" src="https://www.youtube.com/embed/jfKfPfyJRdk" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <!-- 설정 모달창 (숨김 처리됨) -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h3>대시보드 정보 설정</h3>
            
            <label>강좌명 기입:</label>
            <input type="text" id="input-title" placeholder="변경하실 강좌명을 입력하십시오.">

            <label>출석 QR 이미지 주소(URL):</label>
            <input type="text" id="input-qr" placeholder="QR 코드 이미지의 링크를 입력하십시오.">

            <label>유튜브 영상 주소(URL):</label>
            <input type="text" id="input-youtube" placeholder="재생할 유튜브 링크를 입력하십시오.">

            <div class="btn-group">
                <button id="save-settings-btn" class="simple-btn save-btn">적용하기</button>
                <button id="close-settings-btn" class="simple-btn cancel-btn">닫기</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
